name: Publish Keymap Visualizer

on:
  push:
    branches:
      - V3.0
    paths:
      - 'config/adv360.keymap'
      - 'generate-visualizer.sh'
      - 'parse-keymap.py'
      - 'keymap-visualizer-template.html'
      - '.github/workflows/publish-visualizer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate visualizer
        run: |
          chmod +x generate-visualizer.sh parse-keymap.py
          ./generate-visualizer.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
